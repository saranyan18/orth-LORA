# Reference: separate uniform LoRA per task, no orthogonality, oracle task IDs at test time
seed: 0
out_dir: runs/oracle_lora
tasks: [gsm8k, mbpp, arc_challenge, sst2]
model: {name: Qwen/Qwen2.5-1.5B, load_in_4bit: true, dtype: bfloat16, max_len: 768, gradient_checkpointing: true}
data: {n_train: 2000, n_eval: 200}
lora: {targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj], capacity: 64, alpha_ratio: 2.0, avg_rank: 8, r_min: 0, r_max: 32, adapter_mode: separate}
budget: uniform
orth: none
router: {type: prototype}
train: {epochs: 1, bs: 4, grad_accum: 4, lr: 2.0e-4, warmup: 0.03, active: isolated, replay_ratio: 0.0}
probe: {n_examples: 200, bs: 4, granularity: layer}
eval: {bs: 8, max_new_tokens: 256, routing: oracle, extra_routings: [], base: true, eval_future: false}
