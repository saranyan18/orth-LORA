seed: 0
out_dir: runs/ours
tasks: [gsm8k, mbpp, arc_challenge, sst2]
model: {name: Qwen/Qwen2.5-1.5B, load_in_4bit: true, dtype: bfloat16, max_len: 768, gradient_checkpointing: true}  # T4: dtype: float16
data: {n_train: 2000, n_eval: 200}
lora:
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  capacity: 64          # rank pool per module
  alpha_ratio: 2.0
  avg_rank: 8           # per-task budget = avg_rank * n_modules
  r_min: 0
  r_max: 32
  adapter_mode: separate   # separate | shared
budget: causal             # uniform | causal | gradient
orth: activation           # none | parameter | activation
orth_cfg: {energy_thr: 0.90, n_tokens: 512, max_new: 128, max_total_frac: 0.6, lambda_param: 1.0, keep_activations: false}
router: {type: prototype, top_k: 1, shrinkage: 0.1, temperature: 1.0, augment: true, n_fit: 500, layer: null}
train: {epochs: 1, bs: 4, grad_accum: 4, lr: 2.0e-4, warmup: 0.03, active: auto, replay_ratio: 0.0, replay_buffer: 200}
probe: {n_examples: 200, bs: 4, granularity: layer, conflict_lambda: 0.0}
eval: {bs: 8, max_new_tokens: 256, routing: router, extra_routings: [oracle, cumulative], base: true, eval_future: false}
